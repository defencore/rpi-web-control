<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1058" viewBox="0 0 820 1058" role="img" aria-labelledby="title description">
  <title id="title">Raspberry Pi 40-pin GPIO header with dry-contact recording inputs</title>
  <desc id="description">Component-side view of the Raspberry Pi 5 and CM5 IO Board J8 header. Align the board’s pin 1 mark at the upper left. Odd physical pins run down the left column; even pins run down the right. GPIO17 is physical pin 11; connect contact A between it and ground pin 9. The optional second contact B connects GPIO27, pin 13, to ground pin 14. Both switches are drawn open. The inputs use internal pull-ups.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #162e36; }
    .heading { font-size: 29px; font-weight: bold; }
    .body { font-size: 15px; }
    .muted { fill: #425a60; }
    .col { fill: #425a60; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    .signal { font-size: 17px; font-weight: bold; }
    .use { font-size: 15px; fill: #425a60; }
    .pin { text-anchor: middle; font-size: 13px; font-weight: bold; }
    .contact-a { fill: #006554; }
    .contact-b { fill: #6740a3; }
    .supply { fill: #a24213; }
    .ground { fill: #495963; }
    .reserved { fill: #744b19; }
    .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="820" height="1058" rx="12" fill="#ffffff"/>
  <text x="28" y="47" class="heading">Raspberry Pi 40-pin GPIO header</text>
  <text x="28" y="74" class="body muted">Raspberry Pi 5 · Compute Module 5 IO Board (J8). Check the pinout on other carriers.</text>
  <path d="M28 91H792" stroke="#c9d4d3"/>
